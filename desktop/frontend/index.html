<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Voice Room</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #101214;
        --text: #e6e6e6;
        --muted: #8b8f94;
        --accent: #e0352b;
        --line: #2a2e32;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--text);
        font-family: "Cascadia Mono", Consolas, "SFMono-Regular", Menlo, monospace;
        -webkit-font-smoothing: antialiased;
        user-select: none;
      }

      main {
        width: min(420px, 82vw);
      }

      .label {
        margin: 0 0 6px;
        color: var(--accent);
        font-size: 11px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 14px;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: 0.01em;
      }

      .rule {
        width: 44px;
        height: 2px;
        margin: 0 0 22px;
        background: var(--accent);
      }

      #loader {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--muted);
        font-size: 13px;
      }

      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--accent);
        animation: pulse 1.4s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 0.25;
          transform: scale(0.8);
        }
        50% {
          opacity: 1;
          transform: scale(1);
        }
      }

      #error {
        display: none;
        padding: 16px 18px;
        border: 1px solid var(--line);
        border-left: 2px solid var(--accent);
        background: #15181b;
        font-size: 13px;
        line-height: 1.55;
      }

      #error p {
        margin: 0;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      #error .hint {
        margin-top: 10px;
        color: var(--muted);
        font-size: 12px;
      }

      @media (prefers-reduced-motion: reduce) {
        .dot {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="label">Local engine</p>
      <h1>Voice Room</h1>
      <div class="rule"></div>
      <div id="loader"><span class="dot"></span><span>Starting the local engine</span></div>
      <div id="error" role="alert">
        <p id="error-message"></p>
        <p class="hint">If a log file is configured, open it to see the engine output.</p>
      </div>
    </main>
    <script>
      function showError(message) {
        var loader = document.getElementById("loader");
        var panel = document.getElementById("error");
        var text = document.getElementById("error-message");
        if (loader) {
          loader.style.display = "none";
        }
        if (text) {
          text.textContent = String(message);
        }
        if (panel) {
          panel.style.display = "block";
        }
      }

      window.showError = showError;
    </script>
  </body>
</html>
