<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice Room</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/styles.css">
</head>
<header>
  <div class="wordmark"><span class="mark" aria-hidden="true"></span><h1>voice room</h1><span class="onair" aria-live="polite">on air</span></div>
  <div class="privacy">Runs here. Nothing is uploaded.</div>
</header>
<div class="shell">
  <aside>
    <div class="field">
      <label for="engines">Engine</label>
      <div class="engines" id="engines" role="group" aria-label="Speech engine"></div>
    </div>
    <div class="field">
      <label for="voice">Voice</label>
      <select id="voice"></select>
    </div>
    <div class="field">
      <label for="speed">Speed</label>
      <div class="speed-row"><input id="speed" type="range" min="0.6" max="1.5" step="0.05" value="1"><output id="speedVal">1.00</output></div>
    </div>
    <div class="note" id="note">Loading engines from your local models...</div>
    <div class="store" id="modelsLabel">Models: local</div>
  </aside>
  <main>
    <div class="stage-head"><h2>Script</h2><span class="count" id="count">0 chars</span></div>
    <textarea id="script" placeholder="Write what you want to hear." spellcheck="true"></textarea>
    <div class="transport">
      <button class="speak" id="speak">Speak</button>
      <div class="wave" id="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <button class="stop" id="stop" hidden>Stop</button>
      <span class="status" id="status" role="status" aria-live="polite">Ready</span>
    </div>
    <div class="monitor">
      <span class="monitor-label">Monitor</span><span class="monitor-hint" id="monitorHint">generated audio appears here</span>
      <audio id="player" controls></audio>
      <div class="readout" id="readout" aria-live="polite">
        <div class="readout-head">
          <span class="readout-take" id="takeInfo"></span>
          <a id="download" download="speech.wav" href="#">Download wav</a>
        </div>
        <div class="readout-grid">
          <div><span>Took</span><strong id="statTook">--</strong></div>
          <div><span>Audio length</span><strong id="statLength">--</strong></div>
          <div><span>Throughput</span><strong id="statRate">--</strong></div>
          <div><span>Script</span><strong id="statChars">--</strong></div>
        </div>
      </div>
    </div>
    <section class="recent" id="recentWrap" hidden>
      <h2>Recent clips</h2>
      <div id="recent"></div>
    </section>
  </main>
</div>
<script src="/app.js" defer></script>
</body>
</html>
